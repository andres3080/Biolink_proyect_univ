spring.datasource.url=jdbc:postgresql://localhost:5432/biolink
spring.datasource.username=postgres
spring.datasource.password=tu_contraseña

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Puerto en el que el servidor MLLP escucha mensajes HL7 de los equipos
hl7.server.port=6661

# Host/puerto del equipo (o simulador) al que le mandamos las órdenes (ORM)
hl7.equipo.host=localhost
hl7.equipo.port=6662
